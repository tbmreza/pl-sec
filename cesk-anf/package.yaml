name:                cesk
version:             0.1.0.0
github:              "tbmreza/pl-sec"
license:             BSD-3-Clause
author:              "Reza"
maintainer:          "Reza"
copyright:           "2023 Reza"

extra-source-files:
- README.md
- CHANGELOG.md

description:         Please see the README in this repository at <https://github.com/tbmreza/pl-sec/tree/master/cesk-anf>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  cesk-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cesk

tests:
  cesk-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cesk
